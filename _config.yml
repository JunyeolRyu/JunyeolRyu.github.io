#
# This file contains configuration flags to customize your site
#

# Name of your site (displayed in the header)
name: Junyeol Ryu

# Short bio or description (displayed in the header)
description: Ph.D. Candidate in Economics at the University of Oklahoma


# ==========================================================
#  FOOTER LINKS
#  비워두면 아이콘이 표시되지 않습니다
# ==========================================================

footer-links:
  dribbble:
  email: ryujy1981@gmail.com
  facebook:
  flickr:
  github:
  instagram:
  linkedin: https://www.linkedin.com/in/junyeol-ryu-b87a42226
  pinterest:
  rss:
  twitter:
  stackoverflow:
  youtube:
  googleplus:


# ==========================================================
#  SITE
# ==========================================================

# 사이트 주소 (sitemap.xml 과 RSS feed 에 사용됩니다)
url: "https://junyeolryu.github.io"

# User repository (username.github.io) 이므로 비워둡니다
baseurl: ""

permalink: /:title/

# 댓글 / 통계 — 사용하지 않으면 비워두세요
disqus:
google_analytics:


# ==========================================================
#  PAGE TITLES
#  모든 페이지에서 자동 제목 생성을 끕니다
#  (GitHub Pages 는 jekyll-titles-from-headings 를 기본으로 켜두기 때문에
#   이 설정이 없으면 본문 첫 heading 이 제목으로 잡힙니다)
# ==========================================================

titles_from_headings:
  enabled: false


# ==========================================================
#  MARKDOWN / SASS
# ==========================================================

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'

sass:
  style: :expanded


# ==========================================================
#  PLUGINS
#  ('gems:' 는 구버전 키입니다 — 'plugins:' 를 써야 동작합니다)
# ==========================================================

plugins:
  - jekyll-sitemap
  - jekyll-feed


# ==========================================================
#  EXCLUDE
# ==========================================================

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CNAME


# Jekyll Now version
version: v1.2.0
